<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFlix | Recommender Engine</title>
    <style>
        :root {
            --bg-color: #141414;
            --card-bg: #1f1f1f;
            --accent: #E50914;
            --text-main: #FFFFFF;
            --text-sub: #AAAAAA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px 40px;
        }

        header h1 {
            color: var(--accent);
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 40px;
            max-width: 650px;
        }

        select, input {
            padding: 12px 16px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #222;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input {
            flex: 1;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b20710;
        }

        .row-section {
            margin-bottom: 40px;
        }

        .row-section h2 {
            font-size: 1.4rem;
            margin-bottom: 16px;
        }

        .genre-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 16px;
        }

        .card-row {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #2a2a2a;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 6px;
            background: #2b2b2b;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 10px;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-sub {
            color: var(--text-sub);
            font-size: 0.8rem;
            margin-top: 4px;
        }

        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #222;
            color: var(--text-sub);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>MOVIEFLIX</h1>
    </header>

    <main>
        <section class="search-section">
            <select id="typeSelect" style="max-width: 140px;">
                <option value="All">All Types</option>
                <option value="Movie">Movies</option>
                <option value="TV Show">TV Shows</option>
            </select>
            
            <input type="text" id="movieInput" placeholder="Search a title you like...">
            <button onclick="getRecommendations()">Get Recommendations</button>
        </section>

        <section class="row-section">
            <div class="genre-header">
                <h2>Browse by Genre</h2>
                <select id="genreSelect" onchange="getRecommendations()">
                    <option value="">Select a Genre</option>
                    <option value="Action">Action</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Drama">Drama</option>
                    <option value="Sci-Fi">Sci-Fi</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Horror">Horror</option>
                    <option value="Romance">Romance</option>
                    <option value="Animation">Animation</option>
                </select>
            </div>
            <div class="card-row" id="genreRow"></div>
        </section>

        <section class="row-section">
            <h2>🔥 Top Rated</h2>
            <div class="card-row" id="topRatedRow"></div>
        </section>
    </main>

    <footer>
        Hybrid recommender — content-based (genre cosine similarity) + Bayesian-average popularity ranking.
    </footer>

    <script src="../static/script.js"></script>
</body>
</html>
